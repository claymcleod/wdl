name: Spec compliance / Sprocket

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Compliance tests
    steps:
      - name: Checkout WDL spec repo
        uses: actions/checkout@v6
      - name: Install `spectool`
        run: |
          gh release download --repo openwdl/spectool --pattern '*x86_64*linux*'
          tar -xzf spectool*.tar.gz
          chmod +x spectool
          sudo mv spectool /usr/local/bin/
          rm -rf spectool*.tar.gz
          spectool --version
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install `sprocket`
        run: |
          gh release download --repo stjude-rust-labs/sprocket --pattern '*x86_64*linux*'
          tar -xzvf sprocket*.tar.gz
          chmod +x sprocket
          sudo mv sprocket /usr/local/bin/
          rm -rf sprocket*.tar.gz
          sprocket --version
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run the compliance tests
        run: |
          mkdir -p ./.results/
          echo "📊 Running compliance tests for `${{ github.event.pull_request.head.repo.full_name }}:${{ github.head_ref }}`..."
          spectool test \
            "sprocket run ~{path} ~{input} -e ~{target}" \
            --redirect-stdout \
            --all-capabilities \
            --repository-url "https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git" \
            -b ${{ github.head_ref }} | tee ./.results/shield.json
      - name: Check for differences and post comment
        # Only publish a comment if there is a PR.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare with existing file
          if [[ -f ./.results/shield.json ]]; then
            if ! diff -q shields/sprocket.json ./.results/shield.json > /dev/null 2>&1; then
              echo "📊 Differences detected in Sprocket `shield.json`"
              DIFF_OUTPUT=$(diff -u shields/sprocket.json ./.results/shield.json || true)
              COMMENT_BODY=$(cat <<EOF
          ## 🔍 Sprocket Compliance Test Results Changed

          The compliance test results have changed on branch \`${{ github.head_ref }}\`.

          <details>
          <summary>View diff</summary>

          \`\`\`diff
          ${DIFF_OUTPUT}
          \`\`\`

          </details>

          **Workflow run:** [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          )

              # Post comment on the commit
              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                /repos/${{ github.repository }}/commits/${GITHUB_SHA}/comments \
                -f body="$COMMENT_BODY"

              echo "✅ Posted comment with diff"
            else
              echo "✅ No changes detected"
            fi
          else
            echo "⚠️ No existing shields file to compare against"
          fi
      - name: Publish badge JSON
        # Only publish the badges if this is run by dispatch.
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          BRANCH="${{ github.head_ref }}"
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin $BRANCH
          git checkout $BRANCH
          mv ./.results/shield.json shields/sprocket.json
          git add shields/sprocket.json

          # Update README only if needed
          sed_pattern="https://raw.githubusercontent.com/openwdl/wdl/.*/shields/sprocket.json"
          new_url="https://raw.githubusercontent.com/openwdl/wdl/$BRANCH/shields/sprocket.json"
          run_pattern="https://github.com/$REPO/actions/runs/[0-9]+"
          new_run="https://github.com/$REPO/actions/runs/$RUN_ID"
          echo $new_run
          echo $new_url
          if grep -qE "$sed_pattern" README.md; then
            git pull
            sed -E -i "/sprocket_shields\.json/s|$sed_pattern|$new_url|g" README.md
            sed -E -i "/sprocket_shields\.json/s|$run_pattern|$new_run|g" README.md
            git add README.md
          fi

          # Commit only if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: updates Sprocket shield badge"
            git push $REPO_URL $BRANCH
          else
            echo "🟢 No changes to commit"
          fi
